# GetCapabilities-t (barmely verzio) sajat statikus XML-bol szolgaljuk ki.
# Minden mas kerest (GetMap stb.) tovabbitunk az oeny.hu-ra.
map $args $is_caps {
    default                       0;
    "~*REQUEST=GetCapabilities"   1;
}

server {
    listen 8088;
    server_name _;

    location /wms {
        if ($is_caps) {
            rewrite ^ /__caps last;
        }

        proxy_pass            https://www.oeny.hu/hk-geoserver/hrsz/wms;
        proxy_set_header      Host www.oeny.hu;
        proxy_ssl_server_name on;
        proxy_ssl_name        www.oeny.hu;

        # A kulcs: az eredeti mukodo curl ezt a ket fejlecet kuldte.
        proxy_set_header      Referer "https://www.oeny.hu/oeny/hrsz-kereso/";
        proxy_set_header      User-Agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
        proxy_set_header      Accept-Encoding "";

        proxy_connect_timeout 15s;
        proxy_read_timeout    60s;
    }

    location = /__caps {
        internal;
        alias        /srv/www/capabilities.xml;
        default_type application/xml;
        charset      utf-8;
        charset_types application/xml text/xml;
    }

    location = /health {
        return 200 "ok\n";
    }
}
